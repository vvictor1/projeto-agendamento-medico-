version: '3.8'
services:
 
  rabbitmq:
    image: rabbitmq:3-management
    container_name: rabbitmq_hospital
    ports:
      - "5672:5672"
      - "15672:15672"
    networks:
      - hospital_net

  servico-agenda:
    build: ./Servico-agenda
    container_name: servico_agenda
    depends_on:
      - rabbitmq
    networks:
      - hospital_net

  servico-notificacao:
    build: ./Servico-notificacao
    container_name: servico_notificacao
    depends_on:
      - rabbitmq
    networks:
      - hospital_net

networks:
  hospital_net:
    driver: bridge

    services:
  api-agendamento:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8000:8000"

  prometheus:
    image: prom/prometheus:latest
    container_name: prometheus_clinica
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml
    ports:
      - "9090:9090"

  grafana:
    image: grafana/grafana:latest
    container_name: grafana_clinica
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=admin